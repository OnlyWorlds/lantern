# Lantern's suites, run on GitHub's machines (since 2026-10-26). It runs when someone dispatches it
# (`gh workflow run e2e.yml --ref main`) and on a pull request from a branch of this repository,
# never on a push and never for a fork's pull request. It reads the repository and nothing else: no
# secret, so the live walks (live-*, frames*, leftovers), which need test accounts, run elsewhere.
name: e2e

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  suites:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The runner's package install hung three runs in a row for 22 to 40 minutes (it takes about
      # 40 s when it works): each try gets 6 minutes, and a second try after the first times out.
      # Firefox too: the waymark walk runs its menu in all three engines.
      - name: Browsers
        run: |
          for i in 1 2; do
            timeout 360 npx playwright install --with-deps chromium webkit firefox && exit 0
            echo "browser install try $i did not finish"
          done
          exit 1
      # Every walk in walk/ against the build on vite preview (:5181), one at a time, each under its
      # own time limit (walk/guard.mjs). Left out: the live walks, the generators, callback-host
      # (it reads a Pages deployment) and update (it rebuilds dist/), which runs last.
      - name: walks
        run: |
          npx vite preview --port 5181 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5181/ > /dev/null && break; sleep 1; done
          mkdir -p walk-logs
          failed=()
          for f in walk/*.mjs; do
            n=$(basename "$f" .mjs)
            case "$n" in live-*|frames*|leftovers|callback-host|type-icons|guard|update) continue ;; esac
            echo "::group::$n"
            if node "$f" > "walk-logs/$n.log" 2>&1; then echo "ok   $n"; else echo "FAIL $n (exit $?)"; failed+=("$n"); fi
            tail -n 40 "walk-logs/$n.log"
            echo "::endgroup::"
          done
          echo "::group::update"
          if node walk/update.mjs > walk-logs/update.log 2>&1; then echo "ok   update"; else echo "FAIL update"; failed+=(update); fi
          tail -n 40 walk-logs/update.log
          echo "::endgroup::"
          echo "${#failed[@]} failed: ${failed[*]}"
          [ ${#failed[@]} -eq 0 ]
        env:
          CI: '1'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-logs
          path: |
            walk-logs/
            preview.log
          retention-days: 3
